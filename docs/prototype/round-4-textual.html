<!-- THROWAWAY PROTOTYPE, round four. One terminal-UI mockup for TermRenamer, meant to be buildable in Textual today:
     spotlight (Spotlight), round three's `under` with the owner's changes: no small squares in the title list, the queue drawn
     as today's app draws it, today's textual-fspicker file browser, and round three's `stack` Settings layout.
     Inspiration only: this page is not part of the app and none of its code goes into it. -->

  .fg{color:var(--fg)} .dim{color:var(--dim)} .ln{color:var(--ln)} .acc{color:var(--acc)} .ok{color:var(--ok)} .warn{color:var(--warn)}

<script>
(function () {
  "use strict";
  var W = 120, H = 36;

  /* ================= grid ================= */
  var S, ACTS, POSTERS, BLOCK;
  function newScreen() {

  function len(s) { return [...String(s)].length; }
  function fit(s, w) { var a = [...String(s)]; if (w <= 0) return ""; if (a.length <= w) return a.join("") + " ".repeat(w - a.length); return a.slice(0, w - 1).join("") + "…"; }
  function cut(s, w) { var a = [...String(s)]; return a.length <= w ? a.join("") : a.slice(0, Math.max(0, w - 1)).join("") + "…"; }

  function segs(r, c, list) { list.forEach(function (s) { c = put(r, c, s[0], s[1], s[2]); }); return c; }
  function segw(list) { return list.reduce(function (n, x) { return n + len(x[0]); }, 0); }
  var BX = { single: "┌┐└┘─│", round: "╭╮╰╯─│", heavy: "┏┓┗┛━┃", double: "╔╗╚╝═║" };
  function box(r, c, h, w, cls, kind) {

    for (var i = 1; i < h - 1; i++) { put(r + i, c, b[5], cls); put(r + i, c + w - 1, b[5], cls); }

  function vline(c, r0, r1, cls, ch) { for (var r = r0; r <= r1; r++) put(r, c, ch || "│", cls || "ln"); }

  function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

  function posterOn() { return proto.poster !== "off"; }

  /* A poster is an <img> laid over a rectangle of blank cells, as a terminal image protocol would draw it. */
  function poster(r, c, w, h, t, bg) {
    var p = t ? posterOf(t) : { src: null, label: "", cls: "dim" };
    var hide = ui.modal === "picker" || inter(BLOCK, { r: r, c: c, w: w, h: h });
    var fn = (ST === "preview" && t && !ui.modal && !SET) ? function () { A.picker(); } : null;
    if (p.src && !hide) { fill(r, c, h, w, bg || "", fn); POSTERS.push({ r: r, c: c, w: w, h: h, src: p.src }); return; }
    for (var i = 0; i < h; i++) {
      var s = "";
      for (var j = 0; j < w; j++) s += (i % 2 === 1 && (j + (i % 4 === 1 ? 0 : 2)) % 4 === 1) ? "·" : " ";
      put(r + i, c, s, "ln" + (bg ? " " + bg : ""), fn);
    }
    if (p.label && !hide) { var lr = r + Math.floor(h / 2) - 1; put(lr, c + Math.floor((w - len(p.label) - 2) / 2), " " + p.label + " ", p.cls + " bd", fn); }
  }

  function flush() {
    var html = "";
    for (var r = 0; r < H; r++) {
      html += '<div class="row">';
      var c = 0;
      while (c < W) {
        var cl = S.cl[r][c], a = S.ac[r][c], t = "";
        while (c < W && S.cl[r][c] === cl && S.ac[r][c] === a) { t += S.ch[r][c]; c++; }
        html += "<span" + (cl ? ' class="' + cl + '"' : "") + (a >= 0 ? ' data-a="' + a + '"' : "") + ">" + esc(t) + "</span>";

    POSTERS.forEach(function (p) {

    });

  var HL1 = "Harbour Lights Season 1/", HL2 = "Harbour Lights Season 2/";

      E(HL1, "Harbour Lights S01E03 copy.mkv", 1, 3, "The Lamp Room (1)", "taken"), E(HL2, "Harbour Lights S02E01.mkv", 2, 1, "Low Water"),

    { key: "nl", name: "Northern Line", poster: "the-general", files: [E("", "Northern Line 1x04.mkv", 1, 4, "Last Train")] },
    { key: "sb", name: "Signal Box", poster: "metropolis", files: [E("Signal Box/", "Signal Box S01E01.mkv", 1, 1, "First Shift"), E("Signal Box/", "Signal Box S01E02.mkv", 1, 2, "Points and Levers"), E("Signal Box/", "Signal Box S01E03.mkv", 1, 3, "Fog on the Line")] },
    { key: "ck", name: "Copper Kettle", poster: "the-kid", files: [E("Copper Kettle Season 2/", "Copper Kettle S02E05.mkv", 2, 5, "Market Day"), E("Copper Kettle Season 2/", "Copper Kettle S02E06.mkv", 2, 6, "The Long Table")] },
    { key: "gr", name: "Glasshouse Row", poster: "caligari", files: [E("Glasshouse Row/", "Glasshouse Row S01E01.mkv", 1, 1, "Seedlings"), E("Glasshouse Row/", "Glasshouse Row S01E02.mkv", 1, 2, "Frost Warning"), E("Glasshouse Row/", "Glasshouse Row S01E02.srt", 1, 2, "Frost Warning", "side")] },
    { key: "pl", name: "Paper Lanterns", poster: "safety-last", files: [E("", "Paper Lanterns S03E01.mkv", 3, 1, "The Night Market")] },
    { key: "nf", name: "Night Ferry", poster: "phantom-of-the-opera", files: [E("Night Ferry/", "Night Ferry S01E01.mkv", 1, 1, "Cast Off"), E("Night Ferry/", "Night Ferry S01E02.mkv", 1, 2, "The Crossing")] },
    { key: "qr", name: "Quiet Rivers", poster: null, files: [E("", "Quiet Rivers S01E01.mkv", 1, 1, null, "miss")] },
  ];
  var gi = 0; TV.forEach(function (t) { t.files.forEach(function (f) { f.g = gi++; }); });
  /* While the Plan is built, a title not yet found still shows as its Source. */
  var SRCNAME = { ck: "Copper Kettle Season 2/", gr: "Glasshouse Row/", pl: "Paper Lanterns S03E01.mkv", nf: "Night Ferry/", qr: "Quiet Rivers S01E01.mkv" };
  /* The nine queued Sources, before anything is looked up. */

    { name: "Signal Box/", n: 3, dir: true }, { name: "Copper Kettle Season 2/", n: 2, dir: true },
    { name: "Glasshouse Row/", n: 3, dir: true }, { name: "Night Ferry/", n: 2, dir: true },
    { name: "Northern Line 1x04.mkv", n: 1 }, { name: "Paper Lanterns S03E01.mkv", n: 1 }, { name: "Quiet Rivers S01E01.mkv", n: 1 },
  ];
  var SRCFILES = SOURCES.reduce(function (n, s) { return n + s.n; }, 0);
  /* What the file browser lists at ~/Backups/TV: name, size in bytes, modified time (as textual-fspicker shows them, folders first). */
  var BROWSE = [
    { name: "..", dir: true, size: 352, time: "2026-11-20 19:42:10" },
    { name: "Copper Kettle Season 2", dir: true, size: 128, time: "2026-10-04 21:15:33" },
    { name: "Glasshouse Row", dir: true, size: 160, time: "2026-09-28 18:02:47" },
    { name: "Harbour Lights Season 1", dir: true, size: 288, time: "2026-11-02 20:31:05" },
    { name: "Harbour Lights Season 2", dir: true, size: 160, time: "2026-11-02 20:44:19" },
    { name: "Night Ferry", dir: true, size: 128, time: "2026-08-15 22:10:58" },
    { name: "Signal Box", dir: true, size: 160, time: "2026-10-19 17:26:40" },
    { name: "Northern Line 1x04.mkv", dir: false, size: 1503238553, time: "2026-07-30 23:08:12" },
    { name: "Paper Lanterns S03E01.mkv", dir: false, size: 1288490188, time: "2026-09-02 20:55:21" },
    { name: "Quiet Rivers S01E01.mkv", dir: false, size: 1395864371, time: "2026-10-11 21:37:09" },
  ];
  function browseList() { return ui.addKind === "file" ? BROWSE : BROWSE.filter(function (b) { return b.dir; }); }
  function F(from, fl) { return E("", from, 0, 0, null, fl); }
  var FILM = [
    { key: "me", name: "Metropolis", year: 1927, poster: "metropolis", files: [F("Metropolis 1927.mkv"), F("Metropolis 1927.srt", "side")] },
    { key: "ge", name: "The General", year: 1926, poster: "the-general", files: [F("The General 1926.mkv")] },
    { key: "sj", name: "Sherlock Jr.", year: 1924, poster: "sherlock-jr", files: [F("Sherlock Jr 1924.mp4")] },

  function prov() { return ui.prov[MODE]; }
  function root() { return MODE === "Film" ? ui.set.film : ui.set.tv; }
  function pickOf(t) { return ui.pick[t.key]; }
  function disp(t) { return t.year ? t.name + " (" + t.year + ")" : t.name; }
  function plural(n, w) { return n + " " + w + (n === 1 ? "" : "s"); }
  function bIdx(t) { return ST === "building" ? TV.indexOf(t) : -1; }
  /* the name a row shows: a title, or its Source while it waits for its lookup */
  function label(t) { var i = bIdx(t); return i > 3 ? SRCNAME[t.key] : disp(t); }
  function known(t) { var i = bIdx(t); return i >= 0 ? i < 3 : !!(t.poster || pickOf(t)); }
  function info(t) {

    if (MODE === "Film") return (t.year ? t.year + " · " : "") + plural(t.files.length, "file");

  function toPath(t, f) {

    folder = ui.set.fr ? ui.set.tv + "/" + show + (ui.set.sf ? "/Season " + p2(f.s) : "") + "/" : "~/Backups/TV/" + f.dir;

  function fStat(t, f) {

    var ss = t.files.map(function (f) { return fStat(t, f); });
    function has(w) { return ss.indexOf(w) >= 0; }
    if (ss.every(function (s) { return s === "left out"; })) return "left out";
    if (ST === "preview") return has("no match") ? "no match" : has("name taken") ? "name taken" : has("picked") ? "picked" : "ready";

  function counts() {
    var c = { total: 0 }; Object.keys(STC).forEach(function (k) { c[k] = 0; });
    titles().forEach(function (t) { t.files.forEach(function (f) { c[fStat(t, f)]++; c.total++; }); });
    c.good = c.ready + c["name taken"] + c.picked;

  function tCounts(t) { var c = {}; Object.keys(STC).forEach(function (k) { c[k] = 0; }); t.files.forEach(function (f) { c[fStat(t, f)]++; }); return c; }

})();

<!-- ══ PROTOTYPE BAR, ROUND FOUR: for round-4-textual.html.
     Paste this whole block unchanged just before </body>. It is not part of any design. ══ -->
<style id="proto-bar-style">
  .pbar, .pbar * { box-sizing: border-box; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  .pbar { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .pbar-row { display: flex; align-items: center; gap: 2px; background: #111; color: #fff; border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 999px; padding: 4px 6px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5); font-size: 13px; line-height: 1.2; }
  .pbar button { all: unset; cursor: pointer; padding: 4px 8px; border-radius: 999px; color: #fff; font-size: 13px; white-space: nowrap; }
  .pbar button:hover { background: rgba(255, 255, 255, 0.15); }
  .pbar button[aria-pressed="true"] { background: #fff; color: #111; }
  .pbar button:focus-visible { outline: 2px solid #7dd3fc; outline-offset: 1px; }
  .pbar-label { padding: 0 10px; white-space: nowrap; min-width: 340px; text-align: center; }
  .pbar-label small { opacity: 0.7; font-size: 12px; }
  .pbar-sep { width: 1px; height: 16px; background: rgba(255, 255, 255, 0.25); margin: 0 4px; }
</style>
<div class="pbar" id="proto-bar" aria-label="Prototype controls, not part of the design"></div>
<script id="proto-bar-script">
  (function () {
    var ALL = [
      { file: "round-4-textual.html", key: "spotlight", name: "Spotlight", group: "Textual" },
    ];
    var STATES = [
      ["empty", "Empty"],
      ["adding", "Adding"],
      ["queued", "Queued"],
      ["building", "Building"],
      ["preview", "Preview TV"],
      ["preview-film", "Preview Film"],
      ["applied", "Applied"],
      ["settings", "Settings"],
    ];
    var here = decodeURIComponent(location.pathname.split("/").pop() || "");
    var mine = ALL.filter(function (d) { return d.file === here; });
    if (!mine.length) { mine = ALL.filter(function (d) { return d.file === ALL[0].file; }); here = ALL[0].file; }
    var params = new URLSearchParams(location.search);
    var cur = { variant: params.get("variant"), state: params.get("state"), theme: params.get("theme"), poster: params.get("poster") === "off" ? "off" : "on" };
    if (!mine.some(function (d) { return d.key === cur.variant; })) cur.variant = mine[0].key;
    if (!STATES.some(function (s) { return s[0] === cur.state; })) cur.state = "empty";
    if (cur.theme !== "dark" && cur.theme !== "light") {
      cur.theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    }

    function indexOfCurrent() {
      for (var i = 0; i < ALL.length; i++) if (ALL[i].file === here && ALL[i].key === cur.variant) return i;
      return 0;
    }
    function urlFor(d) {
      return d.file + "?variant=" + d.key + "&state=" + cur.state + "&theme=" + cur.theme + "&poster=" + cur.poster;
    }
    function el(tag, attrs, text) {
      var n = document.createElement(tag);
      for (var k in attrs) n.setAttribute(k, attrs[k]);
      if (text != null) n.textContent = text;
      return n;
    }
    function drawBar() {
      var bar = document.getElementById("proto-bar");
      bar.textContent = "";
      var i = indexOfCurrent(), d = ALL[i];
      var top = el("div", { class: "pbar-row" });
      var prev = el("button", { type: "button", title: "Previous design ( [ )" }, "←");
      prev.onclick = function () { go(-1); };
      var label = el("span", { class: "pbar-label" });
      label.appendChild(document.createTextNode(i + 1 + " / " + ALL.length + " · " + d.name + " "));
      label.appendChild(el("small", {}, "(" + d.group + ")"));
      var next = el("button", { type: "button", title: "Next design ( ] )" }, "→");
      next.onclick = function () { go(1); };
      top.appendChild(prev); top.appendChild(label); top.appendChild(next);
      var row = el("div", { class: "pbar-row" });
      STATES.forEach(function (s) {
        var b = el("button", { type: "button", "aria-pressed": String(s[0] === cur.state), "data-state": s[0] }, s[1]);
        b.onclick = function () { setState(s[0]); };
        row.appendChild(b);
      });
      row.appendChild(el("span", { class: "pbar-sep" }));
      var th = el("button", { type: "button", title: "Switch dark / light" }, cur.theme === "dark" ? "Dark" : "Light");
      th.onclick = function () { setTheme(cur.theme === "dark" ? "light" : "dark"); };
      row.appendChild(th);
      row.appendChild(el("span", { class: "pbar-sep" }));
      var po = el("button", { type: "button", title: "Show or hide the poster panel" }, cur.poster === "on" ? "Poster on" : "Poster off");
      po.onclick = function () { setPoster(cur.poster === "on" ? "off" : "on"); };
      row.appendChild(po);
      bar.appendChild(top); bar.appendChild(row);
    }
    function apply() {
      try { history.replaceState(null, "", urlFor(ALL[indexOfCurrent()])); } catch (e) {}
      var root = document.documentElement;
      root.setAttribute("data-theme", cur.theme);
      root.setAttribute("data-variant", cur.variant);
      root.setAttribute("data-state", cur.state);
      root.setAttribute("data-poster", cur.poster);
      drawBar();
      if (typeof window.renderDesign === "function") window.renderDesign(cur.variant, cur.state, cur.theme);
    }
    function go(delta) {
      var next = ALL[(indexOfCurrent() + delta + ALL.length) % ALL.length];
      if (next.file === here) { cur.variant = next.key; apply(); }
      else location.href = urlFor(next);
    }
    function setState(s) {
      if (!STATES.some(function (x) { return x[0] === s; })) return;
      cur.state = s; apply();
    }
    function setTheme(t) { cur.theme = t === "light" ? "light" : "dark"; apply(); }
    function setPoster(p) { cur.poster = p === "off" ? "off" : "on"; apply(); }

    // What a design may call. Designs move through the flow with proto.setState(...).
    window.proto = {
      setState: setState,
      setTheme: setTheme,
      setPoster: setPoster,
      go: go,
      rerender: apply,
      get state() { return cur.state; },
      get variant() { return cur.variant; },
      get theme() { return cur.theme; },
      get poster() { return cur.poster; },
      states: STATES.map(function (s) { return s[0]; }),
    };

    // [ and ] always change design. Left/right arrows change design only while the
    // terminal frame (.term) does not hold keyboard focus, so a design may use arrows itself.
    document.addEventListener("keydown", function (e) {
      var t = e.target;
      if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === "[") { e.preventDefault(); go(-1); return; }
      if (e.key === "]") { e.preventDefault(); go(1); return; }
      var term = document.querySelector(".term");
      var inTerm = term && term.contains(document.activeElement);
      if (inTerm) return;
      if (e.key === "ArrowLeft") { e.preventDefault(); go(-1); }
      if (e.key === "ArrowRight") { e.preventDefault(); go(1); }
    });

    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", apply);
    else apply();
  })();
</script>
